name: Android CI

on:
  push:
    branches: [ "3.0-preview" ]
  pull_request:
    branches: [ "3.0-preview" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build ZygoteLoader dependencies
      run: |
        git clone --depth 1 --branch 3.1 https://github.com/Kr328/ZygoteLoader.git "$RUNNER_TEMP/ZygoteLoader"
        chmod +x "$RUNNER_TEMP/ZygoteLoader/gradlew"
        "$RUNNER_TEMP/ZygoteLoader/gradlew" -p "$RUNNER_TEMP/ZygoteLoader" publishToMavenLocal
    - name: Build with Gradle
      run: ./gradlew build
